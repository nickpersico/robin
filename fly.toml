app = 'robin-closekit'
primary_region = 'iad'

[build]

[deploy]
  # Run migrations in a one-off release machine BEFORE the new version goes
  # live. If a migration fails (e.g. the DB is read-only), the deploy aborts
  # and the current version keeps serving — instead of the app crash-looping
  # on boot. A no-op upgrade (DB already at head) performs no write, so deploys
  # without pending migrations still succeed even if the DB is read-only.
  release_command = "flask db upgrade"

[env]
  FLASK_APP = 'run.py'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine always running instead of suspending it when idle.
  # Suspend/resume adds cold-start latency to the first request after a quiet
  # period, and a suspended machine also freezes the in-process poll scheduler
  # (so 5-minute polls are missed while idle). For a small always-on service
  # this is the right trade. NOTE: the scheduler runs inside the web process,
  # so run exactly ONE machine (fly scale count 1) until the scheduler is moved
  # to its own process — two always-on machines would poll Close twice.
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
